<body style="margin:0"><div style="position:relative;width:760px;height:1000px;overflow:hidden"><svg
            viewBox="0 0 1200 1800"
            preserveAspectRatio="xMidYMid slice"
            aria-hidden="true"
            style="position:absolute;inset:0;width:100%;height:100%"
        >
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#f5f4f0" />
                    <stop offset="60%" stop-color="#eae8e2" />
                    <stop offset="100%" stop-color="#dcdad3" />
                </linearGradient>

                <filter
                    id="softShadow"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                >
                    <feDropShadow
                        dx="0"
                        dy="12"
                        stdDeviation="16"
                        flood-color="#000000"
                        flood-opacity="0.07"
                    />
                    <feDropShadow
                        dx="0"
                        dy="2"
                        stdDeviation="4"
                        flood-color="#000000"
                        flood-opacity="0.04"
                    />
                </filter>

                <filter
                    id="hubShadow"
                    x="-50%"
                    y="-50%"
                    width="200%"
                    height="200%"
                >
                    <feDropShadow
                        dx="0"
                        dy="8"
                        stdDeviation="12"
                        flood-color="#000000"
                        flood-opacity="0.15"
                    />
                </filter>

                <filter
                    id="lineGlow"
                    x="-20%"
                    y="-20%"
                    width="140%"
                    height="140%"
                >
                    <feDropShadow
                        dx="0"
                        dy="2"
                        stdDeviation="3"
                        flood-color="#a09d96"
                        flood-opacity="0.2"
                    />
                </filter>

                <radialGradient id="hubCore" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="50%" stop-color="#b8b5ad" />
                    <stop offset="100%" stop-color="#6b6862" />
                </radialGradient>

                <radialGradient id="hubOuter" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#e8e6e1" />
                    <stop offset="100%" stop-color="#cfccc4" />
                </radialGradient>
            </defs>

            <rect width="1200" height="1800" fill="url(#bgGrad)" />

            <circle
                cx="260"
                cy="580"
                r="420"
                fill="none"
                stroke="#e0ded7"
                stroke-width="1"
                stroke-dasharray="4 8"
            />
            <circle
                cx="260"
                cy="580"
                r="280"
                fill="none"
                stroke="#e0ded7"
                stroke-width="1"
                stroke-dasharray="2 6"
            />

            <g
                stroke="#ada89e"
                stroke-width="2.5"
                fill="none"
                filter="url(#lineGlow)"
                stroke-linecap="round"
            >
                <path d="M 260 580 C 400 580, 480 180, 580 180" />
                <path d="M 260 580 C 410 580, 510 290, 610 290" />
                <path d="M 260 580 C 430 580, 540 400, 630 400" />
                <path d="M 260 580 C 440 580, 540 510, 620 510" />
                <path d="M 260 580 C 440 580, 530 620, 600 620" />
                <path d="M 260 580 C 420 580, 500 730, 560 730" />
                <path d="M 260 580 C 400 580, 470 840, 510 840" />
                <path d="M 260 580 C 370 580, 420 950, 460 950" />
            </g>

            <g fill="#ada89e">
                <circle cx="580" cy="180" r="4"/><circle cx="610" cy="290" r="4"/><circle cx="630" cy="400" r="4"/><circle cx="620" cy="510" r="4"/><circle cx="600" cy="620" r="4"/><circle cx="560" cy="730" r="4"/><circle cx="510" cy="840" r="4"/><circle cx="460" cy="950" r="4"/>
            </g>

            <g transform="translate(260, 580)" filter="url(#hubShadow)">
                <circle
                    cx="0"
                    cy="0"
                    r="48"
                    fill="url(#hubOuter)"
                    stroke="#ffffff"
                    stroke-width="3"
                />
                <circle cx="0" cy="0" r="32" fill="#ffffff" />
                <circle cx="0" cy="0" r="26" fill="url(#hubCore)" />
                <circle cx="0" cy="0" r="8" fill="#ffffff" />
            </g>

            <g transform="translate(580, 130)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/trendyol.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(610, 240)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/shopify.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(630, 350)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/ideasoft.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(620, 460)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/ciceksepeti.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(600, 570)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/hepsiburada.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(560, 680)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/pttavm.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(510, 790)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/amazon.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
<g transform="translate(460, 900)" filter="url(#softShadow)"><rect width="360" height="100" rx="20" fill="#ffffff"/><image href="/apps/n11.svg" x="50" y="25" width="260" height="50" preserveAspectRatio="xMidYMid meet"/></g>
        </svg><div style="position:absolute;left:0;right:0;bottom:0;padding:40px;padding-top:96px;color:#fff;font-family:system-ui;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)"><p style="font-size:24px;font-weight:500;margin:0 0 8px">Pazaryerlerinizi tek panelden yonetin.</p><p style="font-size:14px;margin:0;color:rgba(255,255,255,.8)">Urun, stok, fiyat ve siparisler.</p></div></div></body>

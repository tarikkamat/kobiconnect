name: CI & Auto Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  app:
    name: Lint · Analyse · Test · Build
    runs-on: ubuntu-latest
    concurrency:
      group: ci-app-${{ github.ref }}
      cancel-in-progress: true
    # phpunit.xml testleri 127.0.0.1:5432'deki kobiconnect_testing'e baglar.
    # Cok kiracili kurulum tenant basina sema actigi icin superuser gerekir;
    # servis konteynerinin POSTGRES_USER'i bu yetkiye zaten sahiptir.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kobiconnect_testing
          POSTGRES_USER: kobiconnect
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kobiconnect -d kobiconnect_testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql, bcmath, intl, zip, pcntl, redis, sockets
          coverage: none
          tools: composer:v2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm install

      - name: Prepare environment
        # passport:keys ZORUNLU: imza anahtarlari repoda tutulmaz (gizli) ve
        # AppServiceProvider onlari base_path('storage')'da arar. Yoksa her
        # OAuth istegi "Invalid key supplied" ile 500 doner.
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --force

      - name: Build frontend assets
        run: npm run build

      - name: Pint (code style check)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check

      - name: PHPUnit Tests
        # --parallel: her surec kendi veritabaninda kosar. Tenancy'nin
        # `central`/`tenant` baglantilarini Laravel kendiliginden
        # yeniden adlandirmaz; hizalama tests/TestCase::setUpTraits()'te.
        run: php artisan test --parallel --compact

  build:
    name: Build & push Docker image
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VDS
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/kobiconnect

            # Pin this release, log in to GHCR and pull the new image
            echo "IMAGE=${{ needs.build.outputs.image }}" > .image.env
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi
            docker compose --env-file .env --env-file .image.env pull app worker scheduler

            # Passport imza anahtarlari: repoda tutulmaz, storage volume'unde
            # yasar. Ilk deploy'da yoklar; uretilmezse her OAuth istegi
            # "Invalid key supplied" ile 500 doner. Idempotent.
            docker compose --env-file .env --env-file .image.env run --rm app \
              sh -c '[ -f storage/oauth-private.key ] || php artisan passport:keys'

            # Run migrations
            docker compose --env-file .env --env-file .image.env run --rm app php artisan migrate --force

            # Restart services with new image
            docker compose --env-file .env --env-file .image.env up -d --remove-orphans
            docker image prune -f

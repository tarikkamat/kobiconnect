name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kobiconnect
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: kobiconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobiconnect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kobiconnect
      DB_USERNAME: kobiconnect
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: predis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CENTRAL_DOMAIN: kobiconnect.test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Katalog migration'i public semasindaki bu extension'lara ve IMMUTABLE
      # f_unaccent sarmalayicisina dayaniyor. Tenant search_path'i public'i
      # ICERMEZ, o yuzden extension'lar public'te olmali ve nitelenerek cagrilmali.
      - name: Prepare PostgreSQL
        run: |
          for db in kobiconnect kobiconnect_testing; do
            PGPASSWORD=secret psql -h 127.0.0.1 -U kobiconnect -d postgres \
              -c "CREATE DATABASE $db;" 2>/dev/null || true
            PGPASSWORD=secret psql -h 127.0.0.1 -U kobiconnect -d "$db" \
              -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
          done

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
